<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>STYLE BUDDY</h1>
    <nav>
      <a href="#" class="active">Home</a>
      <a href="wardrobe.html">Wardrobe</a>
    </nav>
  </header>

  <section class="greeting">
    <p id="greeting-text">Hello 😊, Good Morning!</p>
    <div class="weather">
      <div class="sticker" id="weather-emoji">☀️</div>
      <div class="temp-box">
        <h2 id="weather-main">Sunny</h2>
        <p id="weather-temp">29°C</p>
      </div>
      <div class="sticker" id="weather-emoji2">☀️</div>
    </div>
  </section>

  <section class="category">
    <h2>Choose Category</h2>
    <div class="scroll-box">
      <div class="cat-card">
        <img src="homepage_Casual/casualdress.jpg" alt="casual_image">
        <p>Casual</p> 
      </div>
      <div class="cat-card">
        <img src="homepage_Forml/formaldress.jpg" alt="formalDress_image">
        <p>Formal</p>
      </div>
      <div class="cat-card">
        <img src="homepage_partywear/partydress.png">
        <p>Partywear</p>
      </div>
      <div class="cat-card">
        <img src="homepage_nightwear/nightweardress.jpg">
        <p>Nightwear</p>
      </div>
    </div>
  </section>

  <section class="outfit" id="outfit-section">
    <h2>Your Outfit</h2>
    <div class="outfit-box">
      <p>Select a category to view outfit suggestions 👕</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
